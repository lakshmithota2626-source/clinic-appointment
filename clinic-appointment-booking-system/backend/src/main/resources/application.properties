spring.application.name=clinic-appointment-booking
server.port=${PORT:8080}

# LOCAL: file-based H2 database. Data is stored in backend/data/clinicdb.*
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/clinicdb;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# PostgreSQL on Render: set DB_URL, DB_USERNAME, DB_PASSWORD and DB_DRIVER=org.postgresql.Driver
